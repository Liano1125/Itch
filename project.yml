
name: itchPocket

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

options:
  bundleIdPrefix: com.liano
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

targets:
  itchPocket:
    type: application
    platform: iOS

    sources:
      - path: Sources

    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation

    info:
      path: Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liano.itchPocket
        PRODUCT_NAME: itchPocket
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  itchPocketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    resources:
      - path: Tests/Fixtures
    dependencies:
      - target: itchPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liano.itchPocketTests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  itchPocket:
    build:
      targets:
        itchPocket: all
        itchPocketTests: [test]
    test:
      targets:
        - itchPocketTests
