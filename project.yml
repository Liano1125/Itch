
name: itchPocket

options:
  bundleIdPrefix: com.liano
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

targets:
  itchPocket:
    type: application
    platform: iOS

    sources:
      - path: Sources

    info:
      path: Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liano.itchPocket
        PRODUCT_NAME: itchPocket
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
