name: iOS Build

on:
  push:
    branches:
      - main
      # Validate stacked repository hardening without publishing a nightly release.
      - refactor/repository-boundary-hardening
      - refactor/library-entry-repository
      - refactor/library-write-transaction-hardening
      - refactor/repository-context-capability
      - refactor/app-database-cleanup-transaction
      - refactor/repository-integration-phase2
      - refactor/freeze-v2-schema-snapshot
      - refactor/v3-normalized-persistence-cutover
      - fix/v3-detail-data-recovery
      - fix/v3-migration-integrity-hardening
      - test/historical-v2-store-compatibility
      - test/v3-migration-failure-recovery
  pull_request:
    branches:
      - main
      # Stacked persistence PRs may target the migration branch before it merges.
      - fix/legacy-v2-bootstrap
      - refactor/library-repository-collections-v2
      # Run the next repository slice stacked on this branch.
      - refactor/library-status-history-repository
      - refactor/game-update-repository
      - refactor/calendar-repository
      - refactor/spark-repository
      - refactor/app-state-repository
      - refactor/developer-repository
      - refactor/game-repository
      - refactor/cache-repository
      - refactor/library-entry-repository
      - refactor/library-write-transaction-hardening
      - refactor/repository-context-capability
      - refactor/app-database-cleanup-transaction
      - refactor/freeze-v2-schema-snapshot
      - fix/v3-migration-integrity-hardening
      - test/historical-v2-store-compatibility
  workflow_dispatch:

# Prevent parallel builds from racing while replacing the same nightly Release assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build itchPocket IPA
    runs-on: xcode-27

    steps:
      # 1. 获取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 检查 Xcode 和 iOS SDK
      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-version

      # 3. 安装 XcodeGen
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # 4. Generate a disk store using the original V2 source implementation.
      # This source commit was never merged/released; this is not a released-IPA fixture.
      - name: Generate historical V2 source fixture
        run: |
          set -euo pipefail
          HISTORICAL_V2_SHA="594f33feca5efd578393955014bbc51150037071"
          HISTORICAL_DIR="$RUNNER_TEMP/itchPocket-historical-v2"
          git fetch --no-tags origin "$HISTORICAL_V2_SHA"
          git worktree add --detach "$HISTORICAL_DIR" "$HISTORICAL_V2_SHA"
          trap 'git worktree remove --force "$HISTORICAL_DIR" || true' EXIT

          cp Scripts/HistoricalV2FixtureGenerationTests.swift \
            "$HISTORICAL_DIR/Tests/HistoricalV2FixtureGenerationTests.swift"

          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((d["udid"] for group in data["devices"].values() for d in group if d.get("isAvailable") and d.get("name", "").startswith("iPhone")), ""))')"
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator found for historical V2 fixture generation"
            xcrun simctl list devices available
            exit 1
          fi

          (
            cd "$HISTORICAL_DIR"
            xcodegen generate

            xcodebuild \
                -project itchPocket.xcodeproj \
                -scheme itchPocket \
                -destination "platform=iOS Simulator,id=$DEVICE_ID" \
                -derivedDataPath "$RUNNER_TEMP/historicalV2DerivedData" \
                -parallel-testing-enabled NO \
                -only-testing:itchPocketTests/HistoricalV2FixtureGenerationTests/testGenerateHistoricalV2Fixture \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                test
          )

          APP_PATH="$(find "$RUNNER_TEMP/historicalV2DerivedData/Build/Products" -maxdepth 3 -type d -name 'itchPocket.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Historical V2 host app was not built"
            find "$RUNNER_TEMP/historicalV2DerivedData/Build/Products" -maxdepth 4 -name '*.app' -print
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"

          # XCTest may shut down its simulator after completing the selected test.
          # Reboot the same device before querying its app data container.
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          APP_DATA="$(xcrun simctl get_app_container "$DEVICE_ID" "$BUNDLE_ID" data)"
          SIMULATOR_FIXTURE="$APP_DATA/Documents/HistoricalV2Store"
          if [ ! -s "$SIMULATOR_FIXTURE/itchPocket-v2.store" ]; then
            echo "::error::Historical V2 fixture was not found in the simulator app container"
            find "$APP_DATA/Documents" -maxdepth 3 -print || true
            exit 1
          fi

          # The XCTest bundle copies individual resources, not SQLite WAL/SHM
          # sidecars. Checkpoint the historical store and switch it to DELETE
          # journaling while the source app/container is no longer running.
          sqlite3 "$SIMULATOR_FIXTURE/itchPocket-v2.store" 'PRAGMA wal_checkpoint(TRUNCATE);'
          JOURNAL_MODE="$(sqlite3 "$SIMULATOR_FIXTURE/itchPocket-v2.store" 'PRAGMA journal_mode=DELETE;')"
          QUICK_CHECK="$(sqlite3 "$SIMULATOR_FIXTURE/itchPocket-v2.store" 'PRAGMA quick_check;')"
          if [ "$JOURNAL_MODE" != "delete" ] || [ "$QUICK_CHECK" != "ok" ]; then
            echo "::error::Historical V2 fixture did not become a standalone healthy SQLite database"
            echo "journal_mode=$JOURNAL_MODE"
            echo "quick_check=$QUICK_CHECK"
            exit 1
          fi

          mkdir -p Tests/Fixtures
          rm -rf Tests/Fixtures/HistoricalV2Store
          cp -R "$SIMULATOR_FIXTURE" Tests/Fixtures/HistoricalV2Store
          sqlite3 Tests/Fixtures/HistoricalV2Store/itchPocket-v2.store 'PRAGMA quick_check;'
          echo "Historical V2 fixture generated from $HISTORICAL_V2_SHA"
          find Tests/Fixtures/HistoricalV2Store -maxdepth 1 -type f -print

      # 5. 生成当前 Xcode 项目
      - name: Generate Xcode project
        run: |
          xcodegen generate

      # 5. 检查生成的 Scheme
      - name: Check Xcode Scheme
        run: |
          xcodebuild \
            -list \
            -project itchPocket.xcodeproj

      # 7. Run persistence regression tests, including the historical V2 fixture.
      - name: Run persistence regression tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((d["udid"] for group in data["devices"].values() for d in group if d.get("isAvailable") and d.get("name", "").startswith("iPhone")), ""))')"

          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi

          xcodebuild \
            -project itchPocket.xcodeproj \
            -scheme itchPocket \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/itchPocketTestDerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      # 7. 编译 iPhone 真机 Release 版本
      - name: Build for physical iOS devices
        run: |
          xcodebuild \
            -project itchPocket.xcodeproj \
            -scheme itchPocket \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/itchPocketDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # 7. 检查编译产物和应用配置
      - name: Inspect built app
        run: |
          APP_PATH="$RUNNER_TEMP/itchPocketDerivedData/Build/Products/Release-iphoneos/itchPocket.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::itchPocket.app not found"
            find "$RUNNER_TEMP/itchPocketDerivedData/Build/Products" -name "*.app" -print
            exit 1
          fi

          echo "Bundle Identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          echo "Supported device families:"
          /usr/libexec/PlistBuddy \
            -c "Print :UIDeviceFamily" \
            "$APP_PATH/Info.plist" || true

          echo "Supported orientations:"
          /usr/libexec/PlistBuddy \
            -c "Print :UISupportedInterfaceOrientations" \
            "$APP_PATH/Info.plist" || true

          echo "Launch storyboard:"
          /usr/libexec/PlistBuddy \
            -c "Print :UILaunchStoryboardName" \
            "$APP_PATH/Info.plist" || true

          echo "App executable:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP_PATH/Info.plist"

      # 8. 打包未签名 IPA
      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/itchPocketDerivedData/Build/Products/Release-iphoneos/itchPocket.app"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          mkdir -p "$RUNNER_TEMP/itchPocket-ipa/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/itchPocket-ipa/Payload/"

          cd "$RUNNER_TEMP/itchPocket-ipa"

          /usr/bin/zip -qry \
            "$GITHUB_WORKSPACE/dist/itchPocket-unsigned.ipa" \
            Payload

          cd "$GITHUB_WORKSPACE"

          shasum -a 256 \
            dist/itchPocket-unsigned.ipa \
            > dist/itchPocket-unsigned.ipa.sha256

          echo "IPA package contents:"
          unzip -l dist/itchPocket-unsigned.ipa

      # 9. Keep downloadable IPA and checksum for PR/branch builds as well as main.
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: itchPocket-unsigned-ipa-${{ github.run_number }}
          path: |
            dist/itchPocket-unsigned.ipa
            dist/itchPocket-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      # 10. 将原始 IPA 作为 GitHub Release 附件发布（不经过 ZIP artifact 包装）
      - name: Publish raw IPA release asset
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: itchPocket 最新构建
          target_commitish: main
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            此版本由 GitHub Actions 自动构建。
            IPA 为未签名构建产物，安装前需要自行签名。
          files: |
            dist/itchPocket-unsigned.ipa
            dist/itchPocket-unsigned.ipa.sha256
          overwrite_files: true
          fail_on_unmatched_files: true
