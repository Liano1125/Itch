
name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iOS devices (unsigned)
        run: |
          xcodebuild \
            -project itchPocket.xcodeproj \
            -scheme itchPocket \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/itchPocketDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/itchPocketDerivedData/Build/Products/Release-iphoneos/itchPocket.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Built app not found at $APP_PATH"
            echo "Available app bundles:"
            find "$RUNNER_TEMP/itchPocketDerivedData/Build/Products" -maxdepth 4 -name "*.app" -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist" "$RUNNER_TEMP/itchPocket-ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/itchPocket-ipa/Payload/"

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist"

          cd "$RUNNER_TEMP/itchPocket-ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/itchPocket-unsigned.ipa" Payload

          cd "$GITHUB_WORKSPACE"
          shasum -a 256 dist/itchPocket-unsigned.ipa > dist/itchPocket-unsigned.ipa.sha256
          unzip -l dist/itchPocket-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: itchPocket-unsigned-ipa
          path: |
            dist/itchPocket-unsigned.ipa
            dist/itchPocket-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
